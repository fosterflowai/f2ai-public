name: Build & Deploy GCP

on:
  workflow_call:
    secrets:
      GCP_CREDENTIALS:
        required: true
      # Classic PAT with read:packages. The job's repo-scoped GITHUB_TOKEN
      # cannot read packages published by sibling repos (app-framework's
      # f2ai-boms), so cross-repo Maven resolution needs this org secret.
      PACKAGES_READ_PAT:
        required: false
    inputs:
      GCR:
        required: true
        type: string
      PROJECT_ID:
        required: true
        type: string
      GKE_NAME:
        required: true
        type: string
      GKE_LOCATION:
        required: true
        type: string
      NAMESPACE:
        required: true
        type: string
      ENV:
        required: false
        type: string
        default: 'dev'
      MVN_ARGS:
        required: false
        type: string
        default: ''

jobs:

  build-push-gcr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
    - name: checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089

    - name: Set up JDK 17
      uses: actions/setup-java@215b7e5f829ab9cac114c149667e57dc1b70b4bc
      with:
        java-version: "17"
        distribution: "adopt"

    - name: Run mvn clean install
      env:
        GITHUB_ACTOR: ${{ github.actor }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_PACKAGES_USERNAME: ${{ github.actor }}
        GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_PAT || secrets.GITHUB_TOKEN }}
      run: mvn -U -s mvn-settings.xml clean install -DskipTests -ntp ${{ inputs.MVN_ARGS }}

    - name: Login to GCR
      uses: docker/login-action@dd4fa0671be5250ee6f50aedf4cb05514abda2c7
      with:
        registry: ${{ inputs.GCR }}
        username:  _json_key
        password: ${{ secrets.GCP_CREDENTIALS }}

    - name: Build and Push
      id: build-and-push
      uses: docker/build-push-action@ac9327eae2b366085ac7f6a2d02df8aa8ead720a
      with:
        context: .
        builder: ${{ steps.buildx.outputs.name }}
        push: true
        tags: |
          ${{ inputs.GCR }}/${{ inputs.PROJECT_ID }}/${{ github.repository }}:${{ inputs.ENV }}-${{ github.sha }}
          ${{ inputs.GCR }}/${{ inputs.PROJECT_ID }}/${{ github.repository }}:latest

  deploy-to-gcp:
    name: Deploy to GKE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build-push-gcr]
    steps:
    - name: checkout
      uses: actions/checkout@61b9e3751b92087fd0b06925ba6dd6314e06f089

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed'
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}

    - name: get gke credentials
      id: 'get-credentials'
      uses: 'google-github-actions/get-gke-credentials@64bc7249bbcf78056bb92f14d3cedc2da193946c'
      with:
        cluster_name: ${{ inputs.GKE_NAME }}
        location: ${{ inputs.GKE_LOCATION }}
        project_id: ${{ inputs.PROJECT_ID }}

    - name: Deploy to K8S
      uses: azure/k8s-deploy@2f25f49dce3a648e1451f23f89fd73a2e1085123
      with:
        manifests: |
          ${{ github.workspace }}/manifests/manifests-${{ inputs.ENV }}.yaml
        images: |
          ${{ inputs.GCR }}/${{ inputs.PROJECT_ID }}/${{ github.repository }}:${{ inputs.ENV }}-${{ github.sha }}
        namespace: ${{ inputs.NAMESPACE }}
