name: GKE env-secrets preflight

on:
  workflow_call:
    secrets:
      GCP_CREDENTIALS:
        required: true
    inputs:
      PROJECT_ID:
        required: true
        type: string
      GKE_NAME:
        required: true
        type: string
      GKE_LOCATION:
        required: true
        type: string
      NAMESPACE:
        required: false
        type: string
        default: app
      required_keys:
        required: true
        type: string
        description: Newline-separated env-secrets data keys. Existence only.
      shopify_nonce_min_bytes:
        required: false
        type: number
        default: 0
      gcp_service_account_keys:
        required: false
        type: string
        default: ""
        description: Newline-separated keys in Secret gcp-service-account
      workload_identity_email:
        required: false
        type: string
        default: ""

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          project_id: ${{ inputs.PROJECT_ID }}
          cluster_name: ${{ inputs.GKE_NAME }}
          location: ${{ inputs.GKE_LOCATION }}
      - name: Verify required runtime secrets
        env:
          NAMESPACE: ${{ inputs.NAMESPACE }}
          REQUIRED_KEYS: ${{ inputs.required_keys }}
          SHOPIFY_NONCE_MIN_BYTES: ${{ inputs.shopify_nonce_min_bytes }}
          GCP_SA_KEYS: ${{ inputs.gcp_service_account_keys }}
          WI_EMAIL: ${{ inputs.workload_identity_email }}
        run: |
          set -euo pipefail
          jsonpath_escape() {
            printf '%s' "$1" | sed 's/\./\\./g'
          }
          secret_key_present() {
            local secret_name="$1"
            local key="$2"
            local escaped encoded
            escaped="$(jsonpath_escape "${key}")"
            encoded="$(kubectl -n "${NAMESPACE}" get secret "${secret_name}" -o jsonpath="{.data.${escaped}}")"
            if [ -z "${encoded}" ] || [ "${encoded}" = "<no value>" ]; then
              echo "Required secret configuration is missing: ${key} in ${secret_name}." >&2
              return 1
            fi
            printf '%s' "${encoded}"
          }
          missing=0
          while IFS= read -r key; do
            key="$(printf '%s' "${key}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "${key}" ] && continue
            if ! encoded="$(secret_key_present env-secrets "${key}")"; then
              missing=1
              continue
            fi
            if [ "${key}" = "SHOPIFY_NONCE_SECRET" ] && [ "${SHOPIFY_NONCE_MIN_BYTES}" -gt 0 ]; then
              decoded_len="$(printf '%s' "${encoded}" | base64 --decode | wc -c | tr -d ' ')"
              if [ "${decoded_len}" -lt "${SHOPIFY_NONCE_MIN_BYTES}" ]; then
                echo "SHOPIFY_NONCE_SECRET is shorter than ${SHOPIFY_NONCE_MIN_BYTES} decoded bytes." >&2
                missing=1
              fi
            fi
          done <<EOF
          ${REQUIRED_KEYS}
          EOF
          while IFS= read -r key; do
            key="$(printf '%s' "${key}" | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "${key}" ] && continue
            if ! secret_key_present gcp-service-account "${key}" >/dev/null; then
              missing=1
            fi
          done <<EOF
          ${GCP_SA_KEYS}
          EOF
          if [ -n "${WI_EMAIL}" ]; then
            actual="$(kubectl -n "${NAMESPACE}" get serviceaccount gcp-impersonator -o jsonpath='{.metadata.annotations.iam\.gke\.io/gcp-service-account}')"
            if [ "${actual}" != "${WI_EMAIL}" ]; then
              echo "gcp-impersonator Workload Identity annotation mismatch." >&2
              missing=1
            fi
          fi
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
